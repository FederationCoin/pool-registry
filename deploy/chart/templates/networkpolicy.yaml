apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry
spec:
  podSelector:
    matchLabels:
      app: federationcoin-registry
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.port }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: federationcoin-registry-redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: federationcoind
      ports:
        - protocol: TCP
          port: 35332
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443
