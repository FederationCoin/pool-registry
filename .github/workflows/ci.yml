name: CI

on:
  push:
    branches:
      - get-to-mainnet
  pull_request:
    branches:
      - get-to-mainnet
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: OpenAPI breaking vs mainline
        if: github.event_name == 'pull_request'
        id: spec
        run: |
          set -eu
          if git cat-file -e "origin/${{ github.base_ref }}:openapi/registry.yaml" 2>/dev/null; then
            git show "origin/${{ github.base_ref }}:openapi/registry.yaml" > /tmp/registry-base.yaml
            git show "origin/${{ github.base_ref }}:package.json" > /tmp/registry-base-package.json
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "no mainline spec yet; skip"
          fi
      - name: oasdiff breaking
        if: github.event_name == 'pull_request' && steps.spec.outputs.exists == 'true'
        run: |
          set -eu
          curl -fsSL -o /tmp/oasdiff.tgz https://github.com/oasdiff/oasdiff/releases/download/v1.32.1/oasdiff_1.32.1_linux_amd64.tar.gz
          tar -C /tmp -xzf /tmp/oasdiff.tgz
          sudo mv /tmp/oasdiff /usr/local/bin/oasdiff
          python3 .github/contract-bump.py \
            /tmp/registry-base.yaml \
            openapi/registry.yaml \
            /tmp/registry-base-package.json \
            package.json
